[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dq-triage"
version = "0.2.0"
description = "Root-cause failed dbt tests with a read-only Claude agent: evidence pack, investigation, incident note."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amritansh Agrawal" }]
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3", "sqlglot>=30,<31"]
keywords = ["dbt", "data-quality", "incident", "llm", "agents", "claude", "data-engineering"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Database"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "duckdb>=1.0"]

[project.scripts]
dq-triage = "dq_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
