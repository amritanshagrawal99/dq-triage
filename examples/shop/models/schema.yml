version: 2
models:
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [placed, completed, returned]
  - name: orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
